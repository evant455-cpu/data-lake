[project]
name = "datalake"
version = "0.1.0"
description = "A personal data lake and warehouse for ocean, astronomy and other science data"
requires-python = ">=3.11"
dependencies = ["pyarrow", "duckdb"]

[project.optional-dependencies]
dev = ["pytest", "pandas"]
gfw = ["gfw-api-python-client>=1.4", "pandas>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
